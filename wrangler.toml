name = "tacops"
main = "worker/index.ts"
compatibility_date = "2026-08-12"

[assets]
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "tacops-analytics"
database_id = "d5bea7cc-5bf3-461b-a056-97e1a3b1eaa2"

# Enables the dashboard's persisted/queryable Logs tab (distinct from `wrangler tail`'s live-only
# stream) - turned on while debugging why the poller's scheduled invocations weren't leaving any
# trace in D1.
[observability.logs]
enabled = true
invocation_logs = true

# TEMPORARILY DISABLED (2026-10-17): the account is out of D1's free-tier daily row-write quota
# and the current season is basically over anyway - re-enable ("* * * * *") once
# migrations/0009_planet_history_buckets.sql has been applied and the matching worker/poller.ts/
# worker/planet-history.ts fix (see AGENTS.md) is deployed, so the cron doesn't immediately exhaust
# the quota again under the old per-planet-row write pattern.
[triggers]
crons = []
