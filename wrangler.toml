name = "tacops"
main = "worker/index.ts"
compatibility_date = "2026-08-12"

[assets]
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "tacops-analytics"
database_id = "ea154efc-5a0c-4e18-9119-6cbad3b8a61d"

# Enables the dashboard's persisted/queryable Logs tab (distinct from `wrangler tail`'s live-only
# stream) - turned on while debugging why the poller's scheduled invocations weren't leaving any
# trace in D1.
[observability.logs]
enabled = true
invocation_logs = true

# Refreshes the public crusade cache and Domination planet history (worker/poller.ts) on its own
# internal 5-minute gate - see AGENTS.md's "Leaderboard data" section for the D1 write-volume
# history behind this cron's design (bucketed history rows, no per-planet leaderboard fetch, no
# poller_planet_queue walk).
[triggers]
crons = ["* * * * *"]
